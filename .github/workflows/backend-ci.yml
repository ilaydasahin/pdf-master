name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "PdfTools.Api/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "PdfTools.Api/**"

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore PdfTools.Api/PdfTools.Api.csproj

      - name: Build
        run: dotnet build PdfTools.Api/PdfTools.Api.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test PdfTools.Api/PdfTools.Api.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.cobertura.xml"
          flags: backend
          name: backend-coverage

      - name: Security scan - Check for vulnerable packages
        run: dotnet list PdfTools.Api/PdfTools.Api.csproj package --vulnerable --include-transitive || true

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish
        run: dotnet publish PdfTools.Api/PdfTools.Api.csproj --configuration Release --output ./publish

      # Azure App Service deployment (commented out - configure as needed)
      # - name: Deploy to Azure App Service
      #   uses: azure/webapps-deploy@v2
      #   with:
      #     app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
      #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      #     package: ./publish

      # Docker deployment (alternative)
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./PdfTools.Api/Dockerfile
      #     push: true
      #     tags: ${{ secrets.DOCKER_REGISTRY }}/pdftools-api:${{ github.sha }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./publish
          retention-days: 7
