name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "pdf-tools-client/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "pdf-tools-client/**"

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: pdf-tools-client/package-lock.json

      - name: Install dependencies
        working-directory: pdf-tools-client
        run: npm ci

      - name: Run ESLint
        working-directory: pdf-tools-client
        run: npm run lint

      - name: Type check
        working-directory: pdf-tools-client
        run: npx tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: pdf-tools-client/package-lock.json

      - name: Install dependencies
        working-directory: pdf-tools-client
        run: npm ci

      - name: Run unit tests
        working-directory: pdf-tools-client
        run: npm run test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pdf-tools-client/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: pdf-tools-client/package-lock.json

      - name: Install dependencies
        working-directory: pdf-tools-client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: pdf-tools-client
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: pdf-tools-client
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pdf-tools-client/playwright-report/
          retention-days: 7

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: pdf-tools-client/package-lock.json

      - name: Install dependencies
        working-directory: pdf-tools-client
        run: npm ci

      - name: Build
        working-directory: pdf-tools-client
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_ID }}
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: pdf-tools-client/.next
          retention-days: 7

  deploy-vercel:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: pdf-tools-client
          vercel-args: "--prod"

  lighthouse:
    name: Lighthouse Performance Audit
    needs: deploy-vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://pdftools.com
            https://pdftools.com/merge
            https://pdftools.com/split
          uploadArtifacts: true
          temporaryPublicStorage: true
